name: Bale attendance

on:
  workflow_dispatch:
    inputs:
      window_minutes:
        description: "مدت تست دستی (دقیقه)؛ اجرای خودکار پنجشنبه همیشه ۱۰ دقیقه است"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "10"
        default: "1"
  schedule:
    # Every Thursday at 10:00 Asia/Tehran (06:30 UTC)
    - cron: "30 6 * * 4"

permissions:
  contents: read

jobs:
  attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run attendance session
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: "4477425950"
          TIMEZONE: "Asia/Tehran"
          ATTENDANCE_WINDOW_MINUTES: ${{ inputs.window_minutes || '10' }}
        run: python bot.py
