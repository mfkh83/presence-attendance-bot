name: Bale attendance

on:
  workflow_dispatch:
  schedule:
    # Every Thursday at 10:00 Asia/Tehran (06:30 UTC)
    - cron: "30 6 * * 4"

permissions:
  contents: read

jobs:
  attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 15-minute attendance session
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: "4477425950"
          TIMEZONE: "Asia/Tehran"
          ATTENDANCE_WINDOW_MINUTES: "15"
        run: python bot.py
